# ============================================================================
# Conda environment — NEX-CP-conformal-soh-audit
#
# Usage:
#   conda env create -f environment.yml
#   conda activate nex-cp-conformal-soh-audit
#
# Versions are pinned identically to pyproject.toml / requirements.txt.
# ============================================================================

name: nex-cp-conformal-soh-audit

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # Core analysis pipeline (scripts/preprocess_real_battery.py, scripts/run_*.py)
  - numpy=2.2.6
  - pandas=2.3.3
  - scikit-learn=1.7.2
  - scipy=1.15.3

  # Supporting packages (ranges match pyproject.toml)
  - pyyaml>=6,<7
  - openpyxl>=3.1,<4   # pandas engine for the CALCE .xlsx workbooks
  - ngboost>=0.5,<1    # optional NGBoost baseline in the repair runners

  - pip
