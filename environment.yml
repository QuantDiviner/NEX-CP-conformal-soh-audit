# ============================================================================
# Conda 环境配置
# ============================================================================
# 使用方法:
#   创建环境: conda env create -f environment.yml
#   激活环境: conda activate [项目名称]
#   更新环境: conda env update -f environment.yml
#   导出环境: conda env export > environment.yml
# ============================================================================

name: project_name  # TODO: 修改为你的项目名称

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Python 版本
  - python=3.10

  # 核心科学计算
  # - numpy=1.24
  # - pandas=2.0
  # - scipy=1.11

  # 深度学习框架 (选择一个)
  # - pytorch=2.0
  # - tensorflow=2.12

  # 可视化
  # - matplotlib=3.7
  # - seaborn=0.12

  # Jupyter
  # - jupyter
  # - jupyterlab

  # pip 依赖
  - pip
  - pip:
    # - some-pip-only-package

# ============================================================================
# 环境记录
# ============================================================================
# 创建日期: YYYY-MM-DD
# CUDA 版本: (如适用)
# cuDNN 版本: (如适用)
